<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDays</title>
    <style>
        .gender-group {
            display: flex;
            gap: 1.5rem; /* 라디오 버튼 사이 간격 */
            align-items: center;
        }
        .gender-group label {
            font-weight: normal;
        }
        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="join-container">
        <h1>회원가입</h1>
        
        <form th:object="${userDto}" th:action="@{/api/v1/user}" method="post">
            <div class="form-group">
                <label for="id">아이디</label>
                <input type="text" th:field="*{id}" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" th:field="*{password}" required>
            </div>
            <div class="form-group">
                <label for="addr">주소</label>
                <input type="text" th:field="*{addr}">
            </div>
            <div class="form-group">
                <label for="addr_dt">상세주소</label>
                <input type="text" th:field="*{addr_dt}">
            </div>
            <div class="form-group">
                <label for="birth">생년월일</label>
                <input type="date" th:field="*{birth}">
            </div>
            <div class="form-group">
                <label for="ph">전화번호</label>
                <input type="tel" th:field="*{ph}">
            </div>
            <div class="form-group">
                <label>성별</label>
                <div class="gender-group">
                    <label>
                        <input type="radio" th:field="*{gender}" value="M"> 남자
                    </label>
                    <label>
                        <input type="radio" th:field="*{gender}" value="F"> 여자
                    </label>
                </div>
            </div>
            <button type="submit" class="submit-btn">가입하기</button>
        </form>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
