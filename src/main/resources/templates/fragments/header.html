<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <div th:fragment="header">
        <header>
            <h1>My Awesome Website</h1>
        </header>

        <section class="auth-section">

            <!-- (A) 로그아웃 상태일 때 -->
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/user/login}" class="button">로그인</a>
            </div>

            <!-- (B) 로그인 상태일 때 -->
            <div sec:authorize="isAuthenticated()">
                <form th:action="@{/api/v1/user/logout}" method="post" style="display: inline;">
                    <button type="submit" class="button">로그아웃</button>
                </form>
            </div>

        </section>
        
        <nav>
            <ul>
                <li><a th:href="@{/board}">Feed</a></li>
                <li><a href="#">Search</a></li>
                
                <!-- [수정된 부분] -->
                <li>
                    <!-- 삼항 연산자 사용: 세션(loginUser)이 있으면 ID를 붙인 URL, 없으면 로그인 페이지 -->
                    <a th:href="${session.loginUser != null} ? @{/user/info/{id}(id=${session.loginUser.id})} : @{/user/login}">
                        Profile
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
