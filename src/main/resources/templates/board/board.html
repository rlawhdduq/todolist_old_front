<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDays</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main>
        <div class="action-bar">
            <a th:href="@{/board/write}" class="btn-write">
                ✏️ 글쓰기
            </a>
        </div>
        
        <section class="board-feed">
            <!-- (★★★★★ 1. "BoardList"가 비어있는지 확인 ★★★★★) -->
            <div th:if="${BoardList == null or BoardList.isEmpty()}" class="empty-feed">
                <p>아직 게시글이 없습니다.</p>
            </div>

            <!-- (★★★★★ 2. "BoardList"로 루프 시작 ★★★★★) -->
            <article class="board-card" th:each="board : ${BoardList}" th:if="${BoardList != null and !BoardList.isEmpty()}">

                <!-- URL은 /board/{boardId} 형태를 가정합니다 -->
                <a th:href="@{'/board/' + ${board.board_id}}" class="card-link-wrapper">
                    <!-- 카드 헤더: 작성자 ID, 작성일 -->
                    <header class="card-header">
                        <span class="card-author" th:text="|작성자 ID: ${board.writer_id}|">작성자 ID: 901186</span>
                        <span class="card-date" th:if="${board.create_time != null}"
                            th:text="${#temporals.format(board.create_time, 'yyyy-MM-dd HH:mm')}">2025-11-16 19:00</span>
                    </header>

                    <!-- 카드 본문: 내용 -->
                    <section class="card-content">
                        <p th:text="${board.content}">게시글 내용이 여기에 들어갑니다...</p>
                    </section>
                </a>
            </article>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
